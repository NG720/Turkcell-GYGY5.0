server.port=8080

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:librarydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console → http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT
jwt.secret=3273357638792F423F4528482B4D6251655468576D5A7134743777217A25432A
jwt.expiration-ms=86400000

# Log seviyeleri
logging.level.com.library=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} %highlight(%-5level) [%-30.30logger{30}] %msg%n
